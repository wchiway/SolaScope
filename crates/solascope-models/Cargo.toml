[package]
name = "solascope-models"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
# Uses an explicitly installed ONNX runtime (ORT_DYLIB_PATH); no binary download.
local-rerank = ["dep:fastembed"]

[dependencies]
solascope-core = { path = "../solascope-core" }
solascope-config = { path = "../solascope-config" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
httpdate = "1"
rand = "0.9"
tracing.workspace = true
fastembed = { version = "=7.7.1", optional = true, default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
tempfile = "3"
tracing-subscriber.workspace = true
