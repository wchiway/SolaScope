[package]
name = "solascope-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "solascope"

[lib]
name = "solascope_cli"
path = "src/lib.rs"

[[bin]]
name = "solascope"
path = "src/main.rs"

[[bin]]
name = "sas"
path = "src/bin/sas.rs"

[features]
default = []
local-rerank = ["solascope-engine/local-rerank"]

[dependencies]
solascope-core.workspace = true
solascope-config.workspace = true
solascope-engine.workspace = true
tokio.workspace = true
tokio-util.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
cap-std.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
fs2.workspace = true
tempfile.workspace = true
semver = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
wiremock.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
