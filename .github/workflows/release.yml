name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

# Serialize publication without cancelling a release that is already uploading.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate the version tag and its source
        id: source
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" != tag ]]; then
              printf '::error::Run this workflow on an existing version tag, not a branch.\n'
              exit 1
          fi
          mkdir -p dist/facts
          python -I -B .github/scripts/prepare_release.py \
              --tag "$RELEASE_TAG" --expected-sha "$EXPECTED_SHA" \
              --output dist/facts/release-facts.json
          jq -r '"source_sha=\(.source_sha)\nversion=\(.version)\ntag=\(.tag)\nprerelease=\(.prerelease)"' \
              dist/facts/release-facts.json >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-facts
          path: dist/facts/release-facts.json
          if-no-files-found: error

  test-and-package:
    needs: prepare
    # No secrets are inherited by build or test jobs. The called workflow checks
    # out this exact tag's commit and uploads the three platform packages here.
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    permissions:
      contents: read

  collect:
    needs: [prepare, test-and-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download this run's tested packages
        uses: actions/download-artifact@v7
        with:
          pattern: solascope-*
          path: dist/ci-artifacts
          merge-multiple: false
      - name: Verify all packages and combine asset checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python -I -B .github/scripts/collect_release.py \
              --artifacts dist/ci-artifacts --output dist/release --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0

  notes:
    needs: [prepare, test-and-package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v7
        with:
          name: release-facts
          path: dist/facts
      - name: Generate the release description with DeepSeek Responses
        shell: bash
        env:
          # Optional: absence or provider failure retains the factual changelog.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: |
          mkdir -p dist/notes
          python -I -B .github/scripts/release_notes.py \
              --facts dist/facts/release-facts.json --output dist/notes/release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: dist/notes/release-notes.md
          if-no-files-found: error

  publish:
    needs: [prepare, collect, notes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: dist/release
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: dist/notes
      - name: Preserve existing releases and verify the remote tag
        run: |
          existing=$(gh api --paginate "repos/$GH_REPO/releases" |
              jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .html_url')
          if [[ -n "$existing" ]]; then
              printf '::error::Release %s already exists; it will not be overwritten.\n' "$RELEASE_TAG"
              exit 1
          fi
          object=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" |
              jq -ec --arg ref "refs/tags/$RELEASE_TAG" '.[] | select(.ref == $ref) | .object')
          type=$(jq -er '.type' <<<"$object")
          sha=$(jq -er '.sha' <<<"$object")
          for _ in {1..10}; do
              if [[ "$type" != tag ]]; then
                  break
              fi
              object=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object')
              type=$(jq -er '.type' <<<"$object")
              sha=$(jq -er '.sha' <<<"$object")
          done
          if [[ "$type" != commit || "$sha" != "$SOURCE_SHA" ]]; then
              printf '::error::The remote tag no longer points to the tested commit.\n'
              exit 1
          fi
      - name: Upload all assets before publishing
        run: |
          args=(--repo "$GH_REPO" --verify-tag --target "$SOURCE_SHA" --title "$RELEASE_TAG"
              --notes-file dist/notes/release-notes.md --draft)
          if [[ "$PRERELEASE" == true ]]; then
              args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/release/* "${args[@]}"
          gh api --paginate "repos/$GH_REPO/releases" |
              jq -ec --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag and .draft)' \
                  >dist/release-state.json
          jq -r '.assets[].name' dist/release-state.json | sort >dist/remote-assets.txt
          for asset in dist/release/*; do
              printf '%s\n' "${asset##*/}"
          done | sort >dist/local-assets.txt
          diff -u dist/local-assets.txt dist/remote-assets.txt
          jq -e 'all(.assets[]; .state == "uploaded")' dist/release-state.json >/dev/null
          python -I -c 'import hashlib, json; from pathlib import Path; state = json.loads(Path("dist/release-state.json").read_text()); root = Path("dist/release"); assert all(asset["size"] == (root / asset["name"]).stat().st_size and asset.get("digest") == "sha256:" + hashlib.sha256((root / asset["name"]).read_bytes()).hexdigest() for asset in state["assets"]), "Uploaded release assets do not match validated files"'
          release_id=$(jq -er '.id' dist/release-state.json)
          latest=legacy
          if [[ "$PRERELEASE" == true ]]; then
              latest=false
          fi
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
              -F draft=false -f make_latest="$latest" >/dev/null
          printf 'Published %s with three platform archives and Windows installers.\n' "$RELEASE_TAG"
