name: Test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit selected by the release caller
        required: true
        type: string

concurrency:
  # A release caller and its reusable CI must not share a cancellation group.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: validate-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test default features
        run: cargo test --workspace --all-targets --locked
      - name: Test release tooling
        run: python -I -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check POSIX installer syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh
      - name: Test the Windows installer with built-in PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .github/scripts/test_windows_install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  local-rerank:
    name: Test optional local reranker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: local-rerank
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test optional local reranker
        run: cargo test --workspace --all-targets --locked --features local-rerank

  package:
    needs: [validate, local-rerank]
    uses: ./.github/workflows/package.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
