[workspace]
resolver = "2"
members = [
    "apps/solascope",
    "crates/solascope-core",
    "crates/solascope-config",
    "crates/solascope-scanner",
    "crates/solascope-parser",
    "crates/solascope-models",
    "crates/solascope-storage",
    "crates/solascope-engine",
]
default-members = ["apps/solascope"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
solascope-core = { path = "crates/solascope-core" }
solascope-config = { path = "crates/solascope-config" }
solascope-scanner = { path = "crates/solascope-scanner" }
solascope-parser = { path = "crates/solascope-parser" }
solascope-models = { path = "crates/solascope-models" }
solascope-storage = { path = "crates/solascope-storage" }
solascope-engine = { path = "crates/solascope-engine" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-std", "io-util", "process", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.9"
dirs = "6"
globset = "0.4"
ignore = "0.4"
notify = "8"
rayon = "1"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
rusqlite = { version = "0.43", features = ["bundled"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.11", features = ["server", "transport-io", "macros"] }
schemars = "1"
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
